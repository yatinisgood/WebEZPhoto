<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141615"><meta name="description" content="EZ Photo 線上底片濾鏡。照片只在你的瀏覽器處理，不需上傳。"><title>EZ Photo — 讓日常，顯影。</title><link rel="stylesheet" href="style.css"></head>
<body>

<main><div class="intro"><div><p class="eyebrow">A LITTLE GRAIN. A LOT OF FEELING.</p><h1>讓日常，<em>顯影。</em></h1></div><p>選一卷底片，留下你的色彩。<br>純粹的照片體驗，從這裡開始。</p></div>
<section class="camera" aria-label="照片編輯器">
<div class="top-hardware">
<button id="top-dial" class="top-dial" aria-label="轉動調整旋鈕，切換縮放焦段" title="轉動旋鈕調整縮放"><span class="dial-rim"></span><span class="dial-scale">− · 0 · ＋</span></button>
<button id="top-shutter" class="top-shutter" aria-label="快門：下載照片，未載入時選擇照片" title="按下快門下載照片"><span class="shutter-cap"></span><span class="shutter-base"></span></button>
</div>
<div class="camera-top"><div class="model">EZ<span>35</span><small>FILM SIMULATOR</small></div><div class="top-tools"><select id="zoom" aria-label="模擬焦距與照片縮放" title="放大後可拖曳照片取景"><option value="1">28 mm · 1×</option><option value="1.4">40 mm · 1.4×</option><option value="2">56 mm · 2×</option><option value="3">85 mm · 3×</option></select><button id="compare" title="按住比較原圖">◧ <span>按住看原圖</span></button><button id="grid" aria-pressed="false">▦ <span>格線</span></button><button id="reset">↺ <span>重設</span></button></div><span class="live"><i></i> LOCAL LAB</span></div>
<div class="camera-body"><div class="screen-frame"><div id="dropzone" class="viewfinder"><canvas id="preview" tabindex="0" aria-label="照片濾鏡預覽；放大後可拖曳或使用方向鍵移動，雙擊回到完整照片"></canvas><div class="screen-top"><span id="image-label">DEMO / 示範風景</span><span id="film-label">CLASSIC NEG · ISO 400</span></div><div id="grid-overlay" class="grid-overlay" hidden></div><div class="focus" aria-hidden="true"></div><div class="empty-hint" id="empty-hint"><span>你的日常，值得一卷底片。</span><button id="choose-main">＋ 選擇照片</button><small>或將照片拖曳至此 · JPG / PNG / WebP</small></div><div class="photo-tuning" role="group" aria-label="照片調整">
<label class="photo-slider vertical-slider temperature-slider"><span>WB</span><input id="warmth" type="range" min="-100" max="100" value="0" aria-label="色溫" aria-orientation="vertical"><output id="warmth-value">0</output></label>
<label class="photo-slider vertical-slider ev-slider"><span>EV</span><input id="exposure" type="range" min="-20" max="20" value="0" aria-label="曝光補償" aria-orientation="vertical"><output id="exposure-value">0.0 EV</output></label>
<label class="photo-slider tint-slider"><span>TINT</span><span class="tint-endpoint" aria-hidden="true">G</span><input id="tint" type="range" min="-100" max="100" value="0" aria-label="TINT 色偏，負值偏綠，正值偏洋紅"><span class="tint-endpoint" aria-hidden="true">M</span><output id="tint-value">0</output></label>
</div><div class="screen-bottom"><span id="dimensions">EZ PHOTO / 001</span><span>● <span id="preview-state">FILM PREVIEW</span></span></div></div></div>
<aside class="camera-controls"><div class="dial-caption">FILM LOADED <span>↓</span></div><button id="current-film" class="film-art" aria-label="選擇底片，現在使用 Classic Neg"></button><button id="choose" class="import-button">▧ <span>更換照片</span></button></aside></div>
<div class="camera-bottom"><span>35mm FILM EXPERIENCE</span><span>DESIGNED FOR YOUR EVERYDAY <b>✦</b></span></div>
</section>

<p id="status" role="status" aria-live="polite"></p>
</main><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><script src="app.js"></script></body></html>
